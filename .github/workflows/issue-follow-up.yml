name: Issue follow-up

# Issues labelled "wait to confirm" are fixed or answered and wait for the reporter.
# After 7 days without activity the reporter gets a reminder and the issue gets "no reply".
# A reply removes "no reply" and restarts the count; otherwise the issue closes 7 days later.

permissions:
  issues: write

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  follow-up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          only-issue-labels: wait to confirm
          days-before-issue-stale: 7
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: no reply
          close-issue-reason: completed
          stale-issue-message: >-
            This should be fixed or answered in the latest release. Could you confirm
            whether it still happens? Without a reply it will be closed in 7 days.
          close-issue-message: >-
            Closing for lack of a reply. If it still happens, leave a comment and it
            will be reopened.
